<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Philip's Drive Time — Progress</title>
<meta name="theme-color" content="#0d0d0d"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--bg2:#141414;--bg3:#1a1a1a;
  --text:#f5f5f5;--muted:rgba(245,245,245,.45);--muted2:rgba(245,245,245,.2);
  --red:#e01c1c;--green:#22c55e;--yellow:#f59e0b;
  --border:rgba(255,255,255,.07);--radius:12px;--sans:'Outfit',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding:0}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border);
  background:var(--bg);position:sticky;top:0;z-index:10;
}
.logo-text{font-size:1rem;font-weight:700;letter-spacing:-.01em}
.logo-text span{color:var(--red)}
.back-link{
  font-size:.8rem;font-weight:600;color:var(--muted);
  text-decoration:none;display:flex;align-items:center;gap:5px;
  transition:color .15s;
}
.back-link:hover{color:var(--text)}
.container{max-width:680px;margin:0 auto;padding:28px 20px 60px}
.header{text-align:center;margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid var(--border)}
.pupil-name{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.start-date{font-size:.84rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px;text-align:center}
.stat-val{font-size:1.7rem;font-weight:800;color:var(--text);letter-spacing:-.02em}
.stat-label{font-size:.7rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.progress-bar{height:5px;background:var(--bg3);border-radius:100px;overflow:hidden;margin-bottom:28px}
.progress-fill{height:100%;background:var(--red);border-radius:100px;transition:width .6s ease}
.cat-heading{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin:22px 0 8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.skill-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:12px}
.skill-name{font-size:.85rem;color:var(--text);line-height:1.4}
.badge{font-size:.65rem;font-weight:700;padding:3px 9px;border-radius:100px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;flex-shrink:0}
.badge.not-started{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}
.badge.in-progress{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.25)}
.badge.confident{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.25)}
.footer{text-align:center;margin-top:36px;font-size:.78rem;color:var(--muted2);line-height:1.8}
.footer a{color:var(--red);text-decoration:none}
.loading{text-align:center;padding:80px 20px;color:var(--muted);font-size:.9rem}
.error-msg{text-align:center;padding:80px 20px;color:var(--red);font-size:.9rem}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="https://philipsdrivetime.com/">&#8592; Back to site</a>
  <div class="logo-text">Philip's <span>Drive Time</span></div>
  <div style="width:80px"></div>
</div>

<div id="app"><div class="loading">Loading progress...</div></div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://lwfseimncimulusdxzwf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3ZnNlaW1uY2ltdWx1c2R4endmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzQ1MjYsImV4cCI6MjA5MzY1MDUyNn0.XKT6QRXch8gDs8SQImMGhqJz0Sv_iIWXLQRQT8LaKqw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const NI_SYLLABUS = [
  { category:'Safety & Vehicle Checks', skills:['Cockpit drill (DSSSM)','Tell me questions (x14 — verbal checks)','Show me questions (x7 — demonstrated checks)','Number plate eyesight check']},
  { category:'Controls & Moving Off', skills:['Controls and instruments','Moving off on a flat road','Moving off uphill','Moving off downhill','Normal stop','Emergency stop']},
  { category:'Gears & Speed', skills:['Appropriate use of gears','Driving at moderate speeds','Use of acceleration','Braking smoothly']},
  { category:'Junctions', skills:['Approaching junctions (MSMPSLM)','T-junctions — turning left','T-junctions — turning right','Emerging from junctions','Crossroads','Box junctions']},
  { category:'Roundabouts', skills:['Single-lane roundabouts','Multi-lane roundabouts','Lane discipline on roundabouts','Giving way correctly']},
  { category:'Road Position & Steering', skills:['Keeping correct road position','Lane discipline','Following distance','Steering control','Overtaking safely']},
  { category:'Manoeuvres', skills:['Parallel parking','Bay parking (forward)','Bay parking (reverse)','Turn in the road (three-point turn)']},
  { category:'Independent Driving', skills:['Following road signs','Following verbal examiner directions','Route planning']},
  { category:'Hazard Awareness', skills:['Pedestrian crossings (zebra, pelican, puffin, toucan)','School zones','Cyclists and motorcyclists','Horse riders and animals','Adverse weather — wet roads','Adverse weather — fog / ice awareness']},
  { category:'Road Types', skills:['Residential streets','Main roads','Dual carriageways','Rural roads','Night driving awareness']},
  { category:'Test Readiness', skills:['Mock test 1 completed','Mock test 2 completed','Theory test — passed','Highway Code revision','Show me / tell me — all 21 known']},
];
const ALL_TOPICS = NI_SYLLABUS.flatMap(s => s.skills);

async function load() {
  const params = new URLSearchParams(window.location.search);
  const pupilId = params.get('pupil');
  if (!pupilId) { document.getElementById('app').innerHTML = '<div class="error-msg">Invalid link.</div>'; return; }

  const { data: pupil } = await sb.from('pupils').select('*').eq('id', pupilId).single();
  const { data: lessons } = await sb.from('lessons').select('*').eq('pupil_id', pupilId);
  const { data: skillRows } = await sb.from('skills').select('*').eq('pupil_id', pupilId);

  if (!pupil) { document.getElementById('app').innerHTML = '<div class="error-msg">Pupil not found.</div>'; return; }

  const skills = {};
  (skillRows||[]).forEach(s => { skills[s.skill_name] = s.status; });

  const confident = Object.values(skills).filter(s=>s==='confident').length;
  const total = ALL_TOPICS.length;
  const pct = Math.round((confident/total)*100);

  const startDate = pupil.start_date
    ? new Date(pupil.start_date + 'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})
    : '';

  document.getElementById('app').innerHTML = `
    <div class="container">
      <div class="header">
        <div class="pupil-name">${pupil.name}</div>
        ${startDate ? `<div class="start-date">Started ${startDate}</div>` : ''}
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-val">${(lessons||[]).length}</div>
          <div class="stat-label">Lessons</div>
        </div>
        <div class="stat">
          <div class="stat-val">${confident}</div>
          <div class="stat-label">Confident</div>
        </div>
        <div class="stat">
          <div class="stat-val">${pct}%</div>
          <div class="stat-label">Readiness</div>
        </div>
      </div>

      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>

      ${NI_SYLLABUS.map(cat => `
        <div class="cat-heading">${cat.category}</div>
        ${cat.skills.map(skill => {
          const status = skills[skill] || 'not-started';
          const label = status==='confident'?'Confident':status==='in-progress'?'In Progress':'Not Started';
          return '<div class="skill-row"><div class="skill-name">' + skill + '</div><span class="badge ' + status + '">' + label + '</span></div>';
        }).join('')}
      `).join('')}

      <div class="footer">
        Read-only progress view<br>
        Powered by <a href="https://ardvio.com" target="_blank">Ardvio</a>
      </div>
    </div>
  `;
}

load();
</script>
</body>
</html>

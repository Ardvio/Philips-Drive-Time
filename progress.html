<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Philip's Drive Time — Progress</title>
<meta name="theme-color" content="#060a14"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a14;--bg2:#0a1424;--bg3:#0f1e38;
  --text:#f0f4ff;--muted:rgba(240,244,255,.5);--muted2:rgba(240,244,255,.25);
  --blue:#1a6bff;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;
  --border:rgba(255,255,255,.08);--radius:12px;--sans:'DM Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding:24px}
.header{text-align:center;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.logo{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.logo span{color:var(--blue)}
.pupil-name{font-size:1.8rem;font-weight:700;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-val{font-size:1.6rem;font-weight:700;color:var(--text)}
.stat-label{font-size:.75rem;color:var(--muted);margin-top:4px}
.progress-bar{height:6px;background:var(--bg3);border-radius:100px;overflow:hidden;margin:16px 0}
.progress-fill{height:100%;background:var(--blue);border-radius:100px;transition:width .5s}
.cat-heading{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:20px 0 8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.skill-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.skill-name{font-size:.85rem;color:var(--text)}
.badge{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:100px;text-transform:uppercase}
.badge.not-started{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
.badge.in-progress{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.2)}
.badge.confident{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.footer{text-align:center;margin-top:32px;font-size:.78rem;color:var(--muted2)}
.footer a{color:var(--blue);text-decoration:none}
.loading{text-align:center;padding:60px;color:var(--muted)}
.error{text-align:center;padding:60px;color:#fca5a5}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading progress...</div></div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://lwfseimncimulusdxzwf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3ZnNlaW1uY2ltdWx1c2R4endmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzQ1MjYsImV4cCI6MjA5MzY1MDUyNn0.XKT6QRXch8gDs8SQImMGhqJz0Sv_iIWXLQRQT8LaKqw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const NI_SYLLABUS = [
  { category:'Safety & Vehicle Checks', skills:['Cockpit drill (DSSSM)','Tell me questions (x14 — verbal checks)','Show me questions (x7 — demonstrated checks)','Number plate eyesight check']},
  { category:'Controls & Moving Off', skills:['Controls and instruments','Moving off on a flat road','Moving off uphill','Moving off downhill','Normal stop','Emergency stop']},
  { category:'Gears & Speed', skills:['Appropriate use of gears','Driving at moderate speeds','Use of acceleration','Braking smoothly']},
  { category:'Junctions', skills:['Approaching junctions (MSMPSLM)','T-junctions — turning left','T-junctions — turning right','Emerging from junctions','Crossroads','Box junctions']},
  { category:'Roundabouts', skills:['Single-lane roundabouts','Multi-lane roundabouts','Lane discipline on roundabouts','Giving way correctly']},
  { category:'Road Position & Steering', skills:['Keeping correct road position','Lane discipline','Following distance','Steering control','Overtaking safely']},
  { category:'Manoeuvres', skills:['Parallel parking','Bay parking (forward)','Bay parking (reverse)','Turn in the road (three-point turn)']},
  { category:'Independent Driving', skills:['Following road signs','Following verbal examiner directions','Route planning']},
  { category:'Hazard Awareness', skills:['Pedestrian crossings (zebra, pelican, puffin, toucan)','School zones','Cyclists and motorcyclists','Horse riders and animals','Adverse weather — wet roads','Adverse weather — fog / ice awareness']},
  { category:'Road Types', skills:['Residential streets','Main roads','Dual carriageways','Rural roads','Night driving awareness']},
  { category:'Test Readiness', skills:['Mock test 1 completed','Mock test 2 completed','Theory test — passed','Highway Code revision','Show me / tell me — all 21 known']},
];
const ALL_TOPICS = NI_SYLLABUS.flatMap(s => s.skills);

async function load() {
  const params = new URLSearchParams(window.location.search);
  const pupilId = params.get('pupil');
  if (!pupilId) { document.getElementById('app').innerHTML = '<div class="error">Invalid link.</div>'; return; }

  const { data: pupil } = await sb.from('pupils').select('*').eq('id', pupilId).single();
  const { data: lessons } = await sb.from('lessons').select('*').eq('pupil_id', pupilId);
  const { data: skillRows } = await sb.from('skills').select('*').eq('pupil_id', pupilId);

  if (!pupil) { document.getElementById('app').innerHTML = '<div class="error">Pupil not found.</div>'; return; }

  const skills = {};
  (skillRows||[]).forEach(s => { skills[s.skill_name] = s.status; });

  const confident = Object.values(skills).filter(s=>s==='confident').length;
  const inProg = Object.values(skills).filter(s=>s==='in-progress').length;
  const total = ALL_TOPICS.length;
  const pct = Math.round((confident/total)*100);

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="logo">Philip's <span>Drive Time</span></div>
      <div class="pupil-name">${pupil.name}</div>
      <div style="font-size:.84rem;color:var(--muted);margin-top:4px">Started ${new Date(pupil.start_date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-val">${(lessons||[]).length}</div><div class="stat-label">Lessons completed</div></div>
      <div class="stat"><div class="stat-val">${confident}</div><div class="stat-label">Skills confident</div></div>
      <div class="stat"><div class="stat-val">${pct}%</div><div class="stat-label">Overall readiness</div></div>
    </div>

    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>

    ${NI_SYLLABUS.map(cat => `
      <div class="cat-heading">${cat.category}</div>
      ${cat.skills.map(skill => {
        const status = skills[skill] || 'not-started';
        const label = status==='confident'?'Confident':status==='in-progress'?'In Progress':'Not Started';
        return `<div class="skill-row"><div class="skill-name">${skill}</div><span class="badge ${status}">${label}</span></div>`;
      }).join('')}
    `).join('')}

    <div class="footer">
      Read-only progress view · <a href="https://sparkling-blini-33cc58.netlify.app">Philip's Drive Time</a>
      <div style="margin-top:8px">Powered by <a href="https://ardvio.com">Ardvio</a></div>
    </div>
  `;
}

load();
</script>
</body>
</html>
